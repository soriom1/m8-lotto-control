name: M8 R3.3.3 Fixed Acceptance

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reconstruct reviewed binary TSR fixture
        run: |
          set -euo pipefail
          if [ ! -f tests/fixtures/SEAL_1243_R5_AUTHORITY_MASTER.tsr ]; then
            base64 -d tests/fixtures/SEAL_1243_R5_AUTHORITY_MASTER.tsr.b64 > tests/fixtures/SEAL_1243_R5_AUTHORITY_MASTER.tsr
          fi
          test "$(sha256sum tests/fixtures/SEAL_1243_R5_AUTHORITY_MASTER.tsr | awk '{print $1}')" = "e27dee9acad28e7c0e0296d21af25fe7328c5d4eee2b8294518a44473d265d11"
      - name: Run reviewed deterministic acceptance suites
        run: |
          set -euo pipefail
          python tests/test_r3_3_trust_root.py
          python tests/test_r3_3_regression.py
          python tests/test_r3_3_2_free_anchor.py
          python tests/test_r3_3_3_anchor_scoring_gate.py
      - name: Reject bytecode artifacts
        run: |
          set -euo pipefail
          if find . -type d -name __pycache__ -o -type f -name '*.pyc' | grep -q .; then
            echo 'BYTECODE_ARTIFACT_FOUND'
            exit 1
          fi
