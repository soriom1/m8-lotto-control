name: M8 R3.3.3 Fixed Acceptance

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reconstruct reviewed acceptance bytes from transport bundles
        run: |
          set -euo pipefail
          tar -xzf tests/transport/r333_tests.tgz
          tar -xzf tests/transport/r333_fixtures.tgz
          test "$(sha256sum tests/test_r3_3_trust_root.py | awk '{print $1}')" = "ff946d6b8d65dd17173d2e19b1e8e602175384909ed1cad4bbc3318989a30c2d"
          test "$(sha256sum tests/test_r3_3_regression.py | awk '{print $1}')" = "866d5c57602b326be5b798480611ee26f8649e2aca306b77a4838f5ce5384607"
          test "$(sha256sum tests/test_r3_3_2_free_anchor.py | awk '{print $1}')" = "010839240f4883d224cb61c1372f1b73ffcab11e49e77e8419f4227ee438a5b9"
          test "$(sha256sum tests/test_r3_3_3_anchor_scoring_gate.py | awk '{print $1}')" = "4ab0f64dcba5ca39e0a59687ae2d28319dae5a28f47f61b1e11bebdd367c1ee4"
          test "$(sha256sum tests/fixtures/M8_TIMESTAMP_TRUST_POLICY_V1.json | awk '{print $1}')" = "93b1ef5e10156e86e4d93d42f77f509cd271a2683a9ee52a78152a69304b6c6f"
          test "$(sha256sum tests/fixtures/SEAL_1243_R5_AUTHORITY_MASTER.tsr | awk '{print $1}')" = "e27dee9acad28e7c0e0296d21af25fe7328c5d4eee2b8294518a44473d265d11"
          test "$(sha256sum tests/fixtures/SEAL_1243_R5_AUTHORITY_MASTER.txt | awk '{print $1}')" = "0c68c940410554cd0b44ab7077b2d6b01782bf86505db71b9dab0d5139d74970"
          test "$(sha256sum tests/fixtures/freetsa_ca.pem | awk '{print $1}')" = "2151b61137ffa86bf664691ba67e7da0b19f98c758e3d228d5d8ebf27e044438"
          test "$(sha256sum tests/fixtures/freetsa_tsa.crt | awk '{print $1}')" = "8bfb0305bb64e2571ca507552ef3245cb1c2fee8728e0ff8689225081ea13467"
      - name: Run reviewed deterministic acceptance suites
        run: |
          set -euo pipefail
          python tests/test_r3_3_trust_root.py
          python tests/test_r3_3_regression.py
          python tests/test_r3_3_2_free_anchor.py
          python tests/test_r3_3_3_anchor_scoring_gate.py
      - name: Reject bytecode artifacts
        run: |
          set -euo pipefail
          if find . -type d -name __pycache__ -o -type f -name '*.pyc' | grep -q .; then
            echo 'BYTECODE_ARTIFACT_FOUND'
            exit 1
          fi

  release_anchor_seal_helper:
    if: github.event_name == 'pull_request' && github.head_ref == 'r4-doc-reseal-anchor-helper-20260927'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      RECORD: release-change-input/ANCHOR_000002.json
      TSQ_B64: release-change-input/ANCHOR_000002.tsq.b64
      TSQ: /tmp/ANCHOR_000002.tsq
      TSR: release-change-output/ANCHOR_000002.tsr
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Decide whether receipt is already persisted
        id: guard
        run: |
          set -euo pipefail
          if [ -f "$TSR" ] && [ -f release-change-output/receipt_meta.txt ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify exact release-change inputs
        if: steps.guard.outputs.needed == 'true'
        run: |
          set -euo pipefail
          base64 -d "$TSQ_B64" > "$TSQ"
          test "$(sha256sum "$RECORD" | awk '{print $1}')" = "32b07b75f592a89fd738f2890ee6c2c5fc6496df43623da91d774e50afc4e2ab"
          test "$(sha256sum "$TSQ" | awk '{print $1}')" = "65d14a0c3fe3c6f6da4f097b894d1d2353b2d7ea5fd47e59f71901489df83104"
          openssl ts -query -in "$TSQ" -text > /tmp/release_query.txt
          grep -q 'Nonce: 0xB84B287B5CDCA720' /tmp/release_query.txt
          grep -q 'Certificate required: yes' /tmp/release_query.txt
      - name: Load pinned FreeTSA trust material
        if: steps.guard.outputs.needed == 'true'
        env:
          TSA_URL: ${{ secrets.M8_TSA_URL }}
          TSA_CA_PEM_B64: ${{ secrets.M8_TSA_CA_PEM_B64 }}
          TSA_SIGNER_PEM_B64: ${{ secrets.M8_TSA_SIGNER_PEM_B64 }}
        run: |
          set -euo pipefail
          test "$TSA_URL" = "https://freetsa.org/tsr"
          test -n "$TSA_CA_PEM_B64" && test -n "$TSA_SIGNER_PEM_B64"
          printf '%s' "$TSA_CA_PEM_B64" | base64 -d > /tmp/tsa_ca.pem
          printf '%s' "$TSA_SIGNER_PEM_B64" | base64 -d > /tmp/tsa_signer.pem
          test "$(sha256sum /tmp/tsa_ca.pem | awk '{print $1}')" = "2151b61137ffa86bf664691ba67e7da0b19f98c758e3d228d5d8ebf27e044438"
          test "$(sha256sum /tmp/tsa_signer.pem | awk '{print $1}')" = "8bfb0305bb64e2571ca507552ef3245cb1c2fee8728e0ff8689225081ea13467"
      - name: Obtain and verify FreeTSA RFC3161 release-change receipt
        if: steps.guard.outputs.needed == 'true'
        env:
          TSA_URL: ${{ secrets.M8_TSA_URL }}
        run: |
          set -euo pipefail
          mkdir -p release-change-output
          curl --fail --silent --show-error -H 'Content-Type: application/timestamp-query' -H 'Accept: application/timestamp-reply' --data-binary "@$TSQ" "$TSA_URL" -o "$TSR"
          openssl ts -verify -queryfile "$TSQ" -in "$TSR" -CAfile /tmp/tsa_ca.pem -untrusted /tmp/tsa_signer.pem
          openssl ts -reply -in "$TSR" -text > /tmp/release_reply.txt
          grep -q 'Status: Granted' /tmp/release_reply.txt
          grep -q 'Nonce: 0xB84B287B5CDCA720' /tmp/release_reply.txt
          {
            echo 'RECORD_SHA256=32b07b75f592a89fd738f2890ee6c2c5fc6496df43623da91d774e50afc4e2ab'
            echo 'TSQ_SHA256=65d14a0c3fe3c6f6da4f097b894d1d2353b2d7ea5fd47e59f71901489df83104'
            echo "TSR_SHA256=$(sha256sum "$TSR" | awk '{print $1}')"
            grep '^Time stamp:' /tmp/release_reply.txt || true
            grep '^Nonce:' /tmp/release_reply.txt || true
          } > release-change-output/receipt_meta.txt
      - name: Persist verified release-change receipt on helper branch
        if: steps.guard.outputs.needed == 'true'
        run: |
          set -euo pipefail
          git config user.name 'm8-release-anchor-bot'
          git config user.email 'm8-release-anchor-bot@users.noreply.github.com'
          git add release-change-output/ANCHOR_000002.tsr release-change-output/receipt_meta.txt
          git commit -m 'Store R4 doc reseal anchor TSR'
          git push origin HEAD:${{ github.head_ref }}
