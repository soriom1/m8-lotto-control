name: M8 RQ008 One-Shot Family4 Seal

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m8-rq008-family4-seal-once.yml'

permissions:
  contents: read

jobs:
  seal:
    runs-on: ubuntu-latest
    env:
      PRIVATE_REPO: soriom1/m8-lotto
      MASTER_PATH: research/rq008/M8_RQ008_FAMILY4_SEAL_MASTER_V1.json
      TSQ_B64_PATH: research/rq008/M8_RQ008_FAMILY4_SEAL_MASTER_V1.tsq.b64
      EXPECTED_MASTER_SHA256: d326607218b562a1c41bad6c2ae6db04b2ede96101078c527312786202ed3a88
      EXPECTED_TSQ_SHA256: 26fe47abfe2807e747e123d243e9fc584dfa2c6cc6694d8faa66a6281368ee6b
    steps:
      - name: Checkout public control code
        uses: actions/checkout@v4
        with:
          ref: main
          path: control

      - name: Checkout private research bytes read-only
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_REPO }}
          ref: main
          token: ${{ secrets.M8_PRIVATE_REPO_PAT }}
          path: private

      - name: Load and verify fixed FreeTSA trust material
        env:
          TSA_CA_PEM_B64: ${{ secrets.M8_TSA_CA_PEM_B64 }}
          TSA_SIGNER_PEM_B64: ${{ secrets.M8_TSA_SIGNER_PEM_B64 }}
        run: |
          set -euo pipefail
          test -n "$TSA_CA_PEM_B64" && test -n "$TSA_SIGNER_PEM_B64"
          printf '%s' "$TSA_CA_PEM_B64" | base64 -d > /tmp/tsa_ca.pem
          printf '%s' "$TSA_SIGNER_PEM_B64" | base64 -d > /tmp/tsa_signer.pem
          test "$(sha256sum /tmp/tsa_ca.pem | awk '{print $1}')" = "2151b61137ffa86bf664691ba67e7da0b19f98c758e3d228d5d8ebf27e044438"
          test "$(sha256sum /tmp/tsa_signer.pem | awk '{print $1}')" = "8bfb0305bb64e2571ca507552ef3245cb1c2fee8728e0ff8689225081ea13467"

      - name: Verify exact RQ008 master and query bytes
        run: |
          set -euo pipefail
          test "$(sha256sum private/$MASTER_PATH | awk '{print $1}')" = "$EXPECTED_MASTER_SHA256"
          base64 -d private/$TSQ_B64_PATH > /tmp/rq008.tsq
          test "$(sha256sum /tmp/rq008.tsq | awk '{print $1}')" = "$EXPECTED_TSQ_SHA256"
          openssl ts -query -in /tmp/rq008.tsq -text > /tmp/rq008_query.txt

      - name: Request and verify RFC3161 receipt
        env:
          TSA_URL: ${{ secrets.M8_TSA_URL }}
        run: |
          set -euo pipefail
          test -n "$TSA_URL"
          mkdir -p receipt
          cp private/$MASTER_PATH receipt/master.json
          cp /tmp/rq008.tsq receipt/method.tsq
          curl --fail --silent --show-error \
            -H 'Content-Type: application/timestamp-query' \
            -H 'Accept: application/timestamp-reply' \
            --data-binary '@/tmp/rq008.tsq' "$TSA_URL" -o receipt/method.tsr
          openssl ts -verify -queryfile /tmp/rq008.tsq -in receipt/method.tsr -CAfile /tmp/tsa_ca.pem -untrusted /tmp/tsa_signer.pem
          openssl ts -verify -data private/$MASTER_PATH -in receipt/method.tsr -CAfile /tmp/tsa_ca.pem -untrusted /tmp/tsa_signer.pem
          openssl ts -reply -in receipt/method.tsr -text > receipt/method_tsr.txt
          MASTER_SHA="$(sha256sum receipt/master.json | awk '{print $1}')"
          TSQ_SHA="$(sha256sum receipt/method.tsq | awk '{print $1}')"
          TSR_SHA="$(sha256sum receipt/method.tsr | awk '{print $1}')"
          printf '{"schema":"M8_RQ008_FAMILY4_SEAL_RECEIPT_V1","research_id":"RQ008_PURCHASE10_EVIDENCE_SHAPE_MAPPING_V1_20260928","master_sha256":"%s","tsq_sha256":"%s","tsr_sha256":"%s","workflow_run_id":"%s","production_changed":false}\n' "$MASTER_SHA" "$TSQ_SHA" "$TSR_SHA" "$GITHUB_RUN_ID" > receipt/receipt.json
          sha256sum receipt/* > receipt/SHA256SUMS.txt

      - name: Upload RQ008 Family4 seal receipt
        uses: actions/upload-artifact@v4
        with:
          name: M8_RQ008_FAMILY4_SEAL_RECEIPT
          path: receipt/
          if-no-files-found: error
